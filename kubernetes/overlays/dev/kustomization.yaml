
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: dev-

replicas:
  - name: flask-aks-api
    count: 1

labels:
  - pairs:
      environment: dev
    includeSelectors: true

images:
  - name: flask-aks-api
    newName: acraksplatformdev12345.azurecr.io/flask-aks-api
    newTag: v2